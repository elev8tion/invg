[build]
  # Directory to change to before starting a build
  base = "."
  # Directory that contains the deploy-ready HTML files and assets generated by the build
  publish = "build"
  # Default build command
  command = "npm run build"

[build.environment]
  # Node.js version
  NODE_VERSION = "18"
  # Disable treating warnings as errors in CI
  CI = "false"

[functions]
  # Serverless functions directory (holds the NoCodeBackend proxy)
  directory = "netlify/functions"
  node_bundler = "esbuild"

# NoCodeBackend proxy. MUST come before the SPA catch-all below --
# Netlify applies the first matching redirect.
[[redirects]]
  from = "/api/ncb/*"
  to = "/.netlify/functions/ncb/:splat"
  status = 200
  force = true

[[redirects]]
  # Redirect all routes to index.html for SPA routing
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and PWA
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # PWA headers
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/static/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Environment variables -- set these in Netlify UI (Site settings -> Environment variables).
# NOT prefixed with REACT_APP_, so CRA cannot inline them into the client bundle:
#   NCB_INSTANCE   = "your_nocodebackend_instance"
#   NCB_API_KEY    = "your_nocodebackend_instance_api_key"
# Client-side only (safe to inline):
#   REACT_APP_EMAILIT_API_KEY = "your-emailit-api-key"